# Dashboard Implementation Plan
# Generated by dashboard-planner agent
# Date: 2026-03-04

dashboard:
  name: "ubi-impact-dashboard"
  title: "Universal Basic Income impact dashboard"
  description: >
    An interactive dashboard showing the impact of a Universal Basic Income
    policy on individual households and across the income distribution. Users
    enter household characteristics (income, filing status, state, number of
    dependents) and see how a UBI reform affects their net income, effective
    tax rate, and benefits received. The dashboard also displays economy-wide
    impacts including revenue sources vs. UBI cost and distributional impact
    by income decile.
  country: us
  audience: public

# ---------------------------------------------------------------------------
# DATA PATTERN
# ---------------------------------------------------------------------------

data_pattern: custom-backend

custom_backend:
  reason: >
    A UBI dashboard requires both household-level calculations with custom
    reform parameters (UBI amount, flat tax rate) AND economy-wide
    microsimulation for distributional and budgetary impacts. The standard
    policyengine-api endpoint (api.policyengine.org/us/calculate) can compute
    household variables but does not support economy-wide simulation, decile
    breakdowns, or revenue-vs-cost analysis. The reform involves setting
    multiple parameters under gov.contrib.ubi_center.basic_income and
    gov.contrib.ubi_center.flat_tax, constructing a reform dict, and running
    both household and macro-scope Simulations -- all best handled by a thin
    custom backend. The "precomputed" pattern is also unsuitable because the
    input space (income x state x filing_status x dependents x ubi_amount x
    flat_tax_rate) is far too large for static JSON. A FastAPI backend on
    Modal wrapping policyengine-us provides a single coherent API surface
    for both household and economy calculations.

  framework: fastapi-modal
  policyengine_package: policyengine-us

  endpoints:
    # -- Household calculation --
    - name: /api/household
      method: POST
      description: >
        Calculate household-level impacts of a UBI reform. Constructs a
        PolicyEngine household JSON from the user inputs, applies the UBI
        reform parameters, and returns baseline vs. reform values for key
        variables.
      inputs:
        - name: employment_income
          type: number
          description: "Annual employment income in USD"
        - name: filing_status
          type: string
          enum:
            - "SINGLE"
            - "JOINT"
            - "HEAD_OF_HOUSEHOLD"
            - "SEPARATE"
            - "SURVIVING_SPOUSE"
          description: "Tax filing status"
        - name: state_code
          type: string
          description: "Two-letter US state code (e.g. CA, TX, NY)"
        - name: num_dependents
          type: integer
          description: "Number of dependent children (0-5)"
        - name: ubi_amount
          type: number
          description: "Annual UBI amount per person in USD"
        - name: flat_tax_rate
          type: number
          description: "Flat tax rate on AGI to fund UBI (0-1)"
          default: 0
      outputs:
        - name: baseline_net_income
          type: number
          description: "Baseline SPM unit net income"
        - name: reform_net_income
          type: number
          description: "Reform SPM unit net income with UBI"
        - name: net_income_change
          type: number
          description: "Absolute change in net income (reform - baseline)"
        - name: baseline_effective_tax_rate
          type: number
          description: "Baseline effective federal income tax rate"
        - name: reform_effective_tax_rate
          type: number
          description: "Reform effective tax rate (including flat tax if any)"
        - name: effective_tax_rate_change
          type: number
          description: "Change in effective tax rate in percentage points"
        - name: baseline_benefits
          type: number
          description: "Total baseline benefits (SNAP, SSI, etc.)"
        - name: reform_benefits
          type: number
          description: "Total reform benefits including UBI payment"
        - name: basic_income_amount
          type: number
          description: "UBI payment amount for this household"
        - name: snap_amount
          type: number
          description: "SNAP benefits under reform"
        - name: ssi_amount
          type: number
          description: "SSI benefits under reform"
      policyengine_variables:
        - spm_unit_net_income
        - income_tax
        - spm_unit_benefits
        - basic_income
        - snap
        - ssi
        - employment_income
        - adjusted_gross_income
        - flat_tax
        - spm_unit_taxes

    # -- Economy-wide simulation --
    - name: /api/economy
      method: POST
      description: >
        Run economy-wide microsimulation comparing baseline to UBI reform.
        Returns budgetary impact, decile-level distributional impacts, and
        winners/losers analysis. Uses the policyengine-us Simulation class
        with scope=macro.
      inputs:
        - name: ubi_amount
          type: number
          description: "Annual UBI amount per person in USD"
        - name: flat_tax_rate
          type: number
          description: "Flat tax rate on AGI to fund UBI (0-1)"
          default: 0
      outputs:
        - name: budget
          type: object
          description: >
            Budgetary impact object with keys: budgetary_impact,
            tax_revenue_impact, benefit_spending_impact
        - name: decile
          type: object
          description: >
            Decile impact with keys: relative (list of 10 floats) and
            average (list of 10 floats for average absolute change)
        - name: intra_decile
          type: object
          description: >
            Intra-decile impact: pct_better_off, pct_worse_off,
            pct_unchanged per decile (1-10)
        - name: poverty
          type: object
          description: >
            Poverty impact: baseline_rate, reform_rate, change
        - name: inequality
          type: object
          description: >
            Inequality impact: baseline_gini, reform_gini, change
      policyengine_variables:
        - spm_unit_net_income
        - income_tax
        - spm_unit_benefits
        - basic_income
        - flat_tax
        - household_net_income
        - household_income_decile
        - in_poverty

    # -- Revenue breakdown --
    - name: /api/revenue-breakdown
      method: POST
      description: >
        Calculate the revenue sources that fund the UBI vs. the total cost
        of UBI payments. Returns data structured for a revenue vs. cost bar
        chart.
      inputs:
        - name: ubi_amount
          type: number
          description: "Annual UBI amount per person in USD"
        - name: flat_tax_rate
          type: number
          description: "Flat tax rate on AGI to fund UBI (0-1)"
          default: 0
      outputs:
        - name: ubi_total_cost
          type: number
          description: "Total annual cost of UBI payments"
        - name: flat_tax_revenue
          type: number
          description: "Revenue raised by the flat tax"
        - name: income_tax_revenue_change
          type: number
          description: "Change in income tax revenue due to reform"
        - name: benefit_spending_change
          type: number
          description: "Change in benefit spending (negative = savings)"
        - name: net_cost
          type: number
          description: "Net budgetary cost (positive = deficit increase)"
      policyengine_variables:
        - basic_income
        - flat_tax
        - income_tax
        - spm_unit_benefits
        - spm_unit_taxes

  reform_parameters:
    description: >
      The UBI reform is constructed by modifying parameters under the
      gov.contrib.ubi_center namespace in policyengine-us. These are
      existing contrib parameters and do not require custom variable
      definitions.
    parameters:
      - path: "gov.contrib.ubi_center.basic_income.amount.person.flat"
        description: "Per-person flat UBI amount (annual, USD)"
        mapped_from: "ubi_amount"
      - path: "gov.contrib.ubi_center.flat_tax.rate.agi"
        description: "Flat tax rate on AGI to fund the UBI"
        mapped_from: "flat_tax_rate"

# ---------------------------------------------------------------------------
# TECH STACK
# ---------------------------------------------------------------------------

tech_stack:
  framework: react-nextjs  # Next.js 14 with App Router
  ui: "@policyengine/ui-kit"
  styling: tailwind-v4-with-design-tokens
  font: inter  # loaded via Google Fonts CDN
  testing: vitest
  charts: recharts  # via PEBarChart from ui-kit
  runtime: bun

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------

components:
  # -- INPUT FORM: Household characteristics --
  - type: input_form
    id: household-inputs
    component_ref: "ui-kit:InputPanel"
    description: >
      Panel with input controls for household characteristics. Rendered
      inside an InputPanel component within the sidebar or top section.
    fields:
      - name: employment_income
        input_type: slider
        component_ref: "ui-kit:SliderInput"
        label: "Employment income"
        min: 0
        max: 500000
        default: 50000
        step: 1000
        format: currency
        formatValue: "(v) => `$${v.toLocaleString()}`"

      - name: filing_status
        input_type: select
        component_ref: "ui-kit:SelectInput"
        label: "Filing status"
        options:
          - { label: "Single", value: "SINGLE" }
          - { label: "Married filing jointly", value: "JOINT" }
          - { label: "Head of household", value: "HEAD_OF_HOUSEHOLD" }
          - { label: "Married filing separately", value: "SEPARATE" }
          - { label: "Surviving spouse", value: "SURVIVING_SPOUSE" }
        default: "SINGLE"

      - name: state_code
        input_type: select
        component_ref: "ui-kit:SelectInput"
        label: "State"
        options: us_states_50_plus_dc
        default: "CA"

      - name: num_dependents
        input_type: select
        component_ref: "ui-kit:SelectInput"
        label: "Number of dependents"
        options:
          - { label: "0", value: "0" }
          - { label: "1", value: "1" }
          - { label: "2", value: "2" }
          - { label: "3", value: "3" }
          - { label: "4", value: "4" }
          - { label: "5+", value: "5" }
        default: "0"

  # -- INPUT FORM: Policy parameters --
  - type: input_form
    id: policy-inputs
    component_ref: "ui-kit:InputPanel"
    description: >
      Policy parameter controls for the UBI reform. Separated from
      household inputs to clearly distinguish personal characteristics
      from policy choices.
    fields:
      - name: ubi_amount
        input_type: slider
        component_ref: "ui-kit:SliderInput"
        label: "UBI amount per person (annual)"
        min: 0
        max: 24000
        default: 6000
        step: 500
        format: currency
        formatValue: "(v) => `$${v.toLocaleString()}`"

      - name: flat_tax_rate
        input_type: slider
        component_ref: "ui-kit:SliderInput"
        label: "Flat income tax rate"
        min: 0
        max: 0.5
        default: 0
        step: 0.01
        format: percent
        formatValue: "(v) => `${(v * 100).toFixed(0)}%`"

  # -- METRIC CARDS --
  - type: metric_card
    id: net-income-change
    component_ref: "ui-kit:MetricCard"
    title: "Net income change"
    description: "Shows how the household's net income changes under the UBI reform"
    props:
      label: "Net income change"
      value_source: "result.net_income_change"
      format: currency
      trend_logic: >
        positive if value > 0, negative if value < 0, neutral if 0
      delta_source: >
        Format as percentage of baseline: (net_income_change /
        baseline_net_income * 100).toFixed(1) + "% of baseline"

  - type: metric_card
    id: effective-tax-rate-change
    component_ref: "ui-kit:MetricCard"
    title: "Effective tax rate change"
    description: "Shows how the household's effective tax rate changes"
    props:
      label: "Effective tax rate change"
      value_source: "result.effective_tax_rate_change"
      format: percent
      trend_logic: >
        negative if value > 0 (higher taxes hurt household),
        positive if value < 0 (lower taxes help household),
        neutral if 0
      delta_source: "percentage points"

  - type: metric_card
    id: benefits-received
    component_ref: "ui-kit:MetricCard"
    title: "Total benefits received"
    description: "Shows total benefits the household receives under reform (including UBI)"
    props:
      label: "Total benefits received"
      value_source: "result.reform_benefits"
      format: currency
      trend_logic: neutral
      delta_source: "Includes UBI payment"

  # -- BAR CHART: Revenue sources vs. UBI cost --
  - type: chart
    id: revenue-vs-cost
    chart_type: bar
    component_ref: "ui-kit:PEBarChart"
    title: "Revenue sources vs. UBI cost"
    description: >
      Bar chart showing the total cost of UBI payments alongside revenue
      sources (flat tax revenue, income tax changes, benefit savings) and
      the net fiscal cost. Uses colorByValue to show costs in gray-600
      and revenues in primary-500.
    data_source: "/api/revenue-breakdown"
    data_transform: >
      Transform API response into array of {category, amount} objects:
      [
        { category: "UBI cost", amount: -ubi_total_cost },
        { category: "Flat tax revenue", amount: flat_tax_revenue },
        { category: "Income tax change", amount: income_tax_revenue_change },
        { category: "Benefit savings", amount: -benefit_spending_change },
        { category: "Net cost", amount: -net_cost }
      ]
    props:
      xKey: "category"
      yKey: "amount"
      height: 400
      colorByValue: true
      positiveColor: "colors.primary[500]"  # teal -- revenue/savings
      negativeColor: "colors.gray[600]"     # gray -- costs
      formatTooltip: "(v) => formatCurrencyBillions(v)"
      xLabel: ""
      yLabel: "Annual amount (USD)"
    responsive:
      desktop: "full width within content area"
      tablet: "full width, reduced height to 300"
      mobile: "full width, horizontal scroll if needed"

  # -- DATA TABLE: Distributional impact by income decile --
  - type: data_table
    id: decile-impact-table
    component_ref: "ui-kit:DataTable"
    title: "Distributional impact by income decile"
    description: >
      Table showing the impact of the UBI reform across 10 income deciles.
      Each row represents one decile with columns for absolute change,
      relative change, and shares of winners/losers.
    data_source: "/api/economy (decile and intra_decile fields)"
    columns:
      - key: "decile"
        header: "Income decile"
        align: left
        format: "row => `Decile ${row.decile}`"
      - key: "average_change"
        header: "Average change"
        align: right
        format: currency_signed
      - key: "relative_change"
        header: "Relative change"
        align: right
        format: percent_signed
      - key: "pct_better_off"
        header: "Better off"
        align: right
        format: percent
      - key: "pct_worse_off"
        header: "Worse off"
        align: right
        format: percent
    responsive:
      desktop: "full table visible"
      tablet: "horizontal scroll"
      mobile: "horizontal scroll with sticky first column"

# ---------------------------------------------------------------------------
# PAGE LAYOUT
# ---------------------------------------------------------------------------

layout:
  structure: single-page-with-tabs
  shell_component: "ui-kit:DashboardShell"

  tabs:
    - id: household
      label: "Your household"
      description: "Shows personalized impact for the user's household"
      sections:
        - type: grid
          columns: 2
          responsive_breakpoint: 768
          items:
            - ref: household-inputs
              span: 1
            - ref: policy-inputs
              span: 1
        - type: grid
          columns: 3
          responsive_breakpoint: 768
          items:
            - ref: net-income-change
            - ref: effective-tax-rate-change
            - ref: benefits-received

    - id: economy
      label: "Economy-wide impact"
      description: "Shows distributional and budgetary impacts"
      sections:
        - type: grid
          columns: 1
          items:
            - ref: policy-inputs  # reused from household tab
        - type: grid
          columns: 1
          items:
            - ref: revenue-vs-cost
        - type: grid
          columns: 1
          items:
            - ref: decile-impact-table

  header:
    component_ref: "ui-kit:Header"
    variant: dark
    background_color: "primary-700"
    title: "Universal Basic Income impact dashboard"
    subtitle: >
      Explore how a UBI policy affects households and the economy
    logo: "https://raw.githubusercontent.com/PolicyEngine/policyengine-app-v2/main/app/public/assets/logos/policyengine/white.png"

  footer:
    text: >
      Built by PolicyEngine using the Enhanced CPS and PolicyEngine US
      microsimulation model.
    link: "https://policyengine.org"

# ---------------------------------------------------------------------------
# EMBEDDING
# ---------------------------------------------------------------------------

embedding:
  register_in_apps_json: true
  display_with_research: true
  slug: "ubi-impact-dashboard"
  tags: ["us", "ubi", "basic-income", "policy", "interactives"]

  hash_params:
    - employment_income
    - filing_status
    - state_code
    - num_dependents
    - ubi_amount
    - flat_tax_rate
    - tab

  country_detection: >
    Read country from #country= hash parameter. Default to "us".
    Only US is supported for this dashboard.

  share_url: >
    When embedded in an iframe, share URLs must point to
    policyengine.org/us/ubi-impact-dashboard#..., not the Vercel
    deployment URL.

  postmessage: >
    When embedded, input changes send postMessage({ type: "hashchange",
    hash }) to parent window for URL synchronization.

# ---------------------------------------------------------------------------
# TESTS
# ---------------------------------------------------------------------------

tests:
  api_tests:
    - name: "household_single_50k_6k_ubi"
      description: "Single filer, $50k income, $6k UBI, no flat tax"
      endpoint: /api/household
      input:
        employment_income: 50000
        filing_status: "SINGLE"
        state_code: "CA"
        num_dependents: 0
        ubi_amount: 6000
        flat_tax_rate: 0
      expected:
        net_income_change:
          min: 0
          max: 10000
        reform_benefits:
          min: 6000
        basic_income_amount:
          min: 5000
          max: 7000

    - name: "household_zero_income"
      description: "Zero income household receives full UBI"
      endpoint: /api/household
      input:
        employment_income: 0
        filing_status: "SINGLE"
        state_code: "CA"
        num_dependents: 0
        ubi_amount: 6000
        flat_tax_rate: 0
      expected:
        net_income_change:
          min: 5000
        basic_income_amount:
          min: 5000

    - name: "household_family_with_dependents"
      description: "Married couple with 2 dependents, $80k, $6k UBI"
      endpoint: /api/household
      input:
        employment_income: 80000
        filing_status: "JOINT"
        state_code: "TX"
        num_dependents: 2
        ubi_amount: 6000
        flat_tax_rate: 0
      expected:
        basic_income_amount:
          min: 20000
          max: 28000
          description: "$6k x 4 people = $24k expected"

    - name: "household_high_income_with_flat_tax"
      description: "High earner with 10% flat tax to fund UBI"
      endpoint: /api/household
      input:
        employment_income: 300000
        filing_status: "SINGLE"
        state_code: "NY"
        num_dependents: 0
        ubi_amount: 6000
        flat_tax_rate: 0.10
      expected:
        net_income_change:
          max: 0
          description: "High earners should be net payers under flat tax"
        effective_tax_rate_change:
          min: 0.05
          description: "Should see meaningful tax rate increase"

    - name: "economy_basic_simulation"
      description: "Economy-wide UBI of $6k with 10% flat tax"
      endpoint: /api/economy
      input:
        ubi_amount: 6000
        flat_tax_rate: 0.10
      expected:
        budget:
          has_keys:
            - "budgetary_impact"
            - "tax_revenue_impact"
            - "benefit_spending_impact"
        decile:
          has_keys: ["relative", "average"]
          decile_count: 10

    - name: "revenue_breakdown_structure"
      description: "Revenue breakdown returns all expected fields"
      endpoint: /api/revenue-breakdown
      input:
        ubi_amount: 6000
        flat_tax_rate: 0.10
      expected:
        ubi_total_cost:
          min: 1000000000000
          description: "UBI for ~330M people at $6k ~ $2T"
        flat_tax_revenue:
          min: 0
          description: "10% flat tax raises significant revenue"

    - name: "economy_zero_ubi"
      description: "Zero UBI amount should yield zero impact"
      endpoint: /api/economy
      input:
        ubi_amount: 0
        flat_tax_rate: 0
      expected:
        budget:
          budgetary_impact: 0

  frontend_tests:
    - name: "renders_without_errors"
      description: "All components mount without console errors"
      type: component_render

    - name: "metric_cards_display_values"
      description: "Three metric cards render with formatted numeric values"
      type: component_render
      components:
        - net-income-change
        - effective-tax-rate-change
        - benefits-received

    - name: "bar_chart_renders_with_data"
      description: "Revenue vs. cost bar chart renders with 5 categories"
      type: component_render
      components:
        - revenue-vs-cost

    - name: "data_table_renders_10_rows"
      description: "Decile impact table renders with exactly 10 data rows"
      type: component_render
      components:
        - decile-impact-table

    - name: "input_slider_updates_state"
      description: "Moving the income slider updates employment_income"
      type: interaction
      steps:
        - action: change_slider
          target: employment_income
          value: 75000
        - assert: state_value
          key: employment_income
          equals: 75000

    - name: "select_input_updates_state"
      description: "Changing filing status updates state"
      type: interaction
      steps:
        - action: change_select
          target: filing_status
          value: "JOINT"
        - assert: state_value
          key: filing_status
          equals: "JOINT"

    - name: "tab_navigation_works"
      description: "Tab switching shows correct components"
      type: interaction
      steps:
        - action: click_tab
          target: economy
        - assert: visible
          component: decile-impact-table
        - action: click_tab
          target: household
        - assert: visible
          component: net-income-change

    - name: "loading_state_shown"
      description: "Loading indicator appears during API calls"
      type: component_render

    - name: "error_state_shown"
      description: "Error message appears when API call fails"
      type: error_handling

  design_compliance:
    - name: "uses_design_tokens_only"
      description: >
        No hardcoded hex color values in component files. All colors
        come from @policyengine/ui-kit design tokens or CSS custom
        properties (--pe-color-*). Exception: getCssVar fallbacks
        in Recharts components (following snap-bbce-repeal pattern).
      validation: >
        grep for hex patterns (#[0-9a-fA-F]{3,8}) in src/components/
        and verify each is a getCssVar fallback, not a primary color.

    - name: "inter_font_loaded"
      description: "Inter font loaded via Google Fonts CDN in layout.jsx"
      validation: >
        Check layout.jsx <head> for Google Fonts Inter link tag.

    - name: "sentence_case_headings"
      description: "All headings and labels use sentence case"
      validation: "Manual review of component text strings"

    - name: "responsive_at_breakpoints"
      description: "Layout adapts at 1024px, 768px, and 480px"
      validation: "Visual regression tests at each breakpoint"
      breakpoints:
        - width: 1024
          expected: "Two-column input layout, full-width charts"
        - width: 768
          expected: "Single-column layout, stacked metric cards"
        - width: 480
          expected: "Single-column, horizontal scroll on table"

    - name: "ui_kit_components_used"
      description: >
        Dashboard uses MetricCard, DataTable, PEBarChart, SliderInput,
        SelectInput, DashboardShell, Header, and InputPanel from
        @policyengine/ui-kit rather than custom implementations.
      validation: "Check imports in component files"

  embedding_tests:
    - name: "country_detection"
      description: >
        Reads country from #country= hash parameter. Defaults to "us".

    - name: "hash_param_sync"
      description: >
        All input values sync to URL hash parameters. Changing an input
        updates the hash; loading a URL with hash params restores inputs.
      params_tested:
        - employment_income
        - filing_status
        - state_code
        - ubi_amount

    - name: "share_url_points_to_policyengine"
      description: >
        Share/copy URL generates policyengine.org URL, not Vercel URL.

    - name: "postmessage_to_parent"
      description: >
        When embedded in iframe, input changes send postMessage to parent.

# ---------------------------------------------------------------------------
# POLICYENGINE VARIABLE REFERENCE
# ---------------------------------------------------------------------------

policyengine_variables:
  household_level:
    - name: basic_income
      entity: tax_unit
      description: "Total basic income (UBI) payments for the tax unit"
      parameter_tree: "gov.contrib.ubi_center.basic_income"

    - name: basic_income_before_phase_out
      entity: tax_unit
      description: "UBI amount before any phase-out is applied"

    - name: flat_tax
      entity: tax_unit
      description: "Flat income tax on AGI or gross income"
      parameter_tree: "gov.contrib.ubi_center.flat_tax"

    - name: income_tax
      entity: tax_unit
      description: "Federal income tax liability"

    - name: spm_unit_net_income
      entity: spm_unit
      description: "Net income = market income + benefits - taxes - expenses"

    - name: spm_unit_benefits
      entity: spm_unit
      description: "Total benefits including basic_income, SNAP, SSI, etc."

    - name: spm_unit_taxes
      entity: spm_unit
      description: "Total taxes including income tax, payroll tax, flat tax"

    - name: snap
      entity: spm_unit
      description: "SNAP (food stamps) benefit amount"

    - name: ssi
      entity: person
      description: "Supplemental Security Income"

    - name: employment_income
      entity: person
